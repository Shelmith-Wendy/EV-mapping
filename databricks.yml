# Databricks Asset Bundle — App + UC Volume + weekly pipeline Job.
# Before App deploy: ./scripts/prepare_databricks_app.sh
#
# Set workspace_host / catalog / alert_email below (or pass --var=...).
#
#   databricks bundle validate -t dev
#   databricks bundle deploy -t dev
#   ./scripts/upload_public_to_volume.sh   # manual seed of Volume (Phase 2 exit)
#   databricks bundle run kenya_ev_map -t dev
#   databricks bundle run kenya_ev_data_refresh -t dev   # manual pipeline trigger

bundle:
  name: kenya-ev-map

variables:
  workspace_host:
    description: Databricks workspace URL
    default: https://YOUR-WORKSPACE.cloud.databricks.com
  catalog:
    description: Unity Catalog name that already exists in the workspace
    default: main
  schema_name:
    description: Schema that owns the zeno_ev_map Volume
    default: zeno_ev_map
  volume_name:
    description: Managed Volume name for published dashboard files
    default: public
  alert_email:
    description: Email for weekly pipeline failure alerts
    default: YOUR-EMAIL@example.com

# Job needs scripts/, regions/, data/raw/; App still ships from ./app only.
sync:
  paths:
    - app
    - scripts
    - regions
    - data/raw
    - requirements-pipeline.txt

resources:
  schemas:
    kenya_ev_schema:
      name: ${var.schema_name}
      catalog_name: ${var.catalog}
      comment: Kenya EV map published dashboard artifacts

  volumes:
    kenya_ev_public:
      name: ${var.volume_name}
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.kenya_ev_schema.name}
      volume_type: MANAGED
      comment: >
        Published dashboard artifacts at
        /Volumes/${var.catalog}/${var.schema_name}/${var.volume_name}/
        (regions.json, <region_id>/contract files, _pipeline_logs/).

  apps:
    kenya_ev_map:
      name: kenya-ev-map
      description: Zeno Moto EV charging coverage map for Kenya (Streamlit + Leaflet)
      source_code_path: ./app

  jobs:
    kenya_ev_data_refresh:
      name: kenya-ev-data-refresh
      description: >
        Weekly refresh of all REGIONS (Kenya + Taipei) into the UC Volume.
        Per-region validate-then-promote; failed regions keep last-good data.
      # Paused by default; prod target unpauses. Dev mode also auto-pauses schedules.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: Africa/Nairobi
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: refresh_all_regions
          spark_python_task:
            python_file: ./scripts/databricks_pipeline_job.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema_name}
              - --volume=${var.volume_name}
          environment_key: pipeline_env
      environments:
        - environment_key: pipeline_env
          spec:
            environment_version: "2"
            dependencies:
              - beautifulsoup4>=4.12.0
              - geopy>=2.4.0
              - openlocationcode>=1.0.1
              - pandas>=2.2.0
              - requests>=2.31.0
              - shapely>=2.0.0

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    resources:
      apps:
        kenya_ev_map:
          name: kenya-ev-map
          permissions:
            - level: CAN_USE
              group_name: users
      jobs:
        kenya_ev_data_refresh:
          schedule:
            quartz_cron_expression: "0 0 6 ? * MON"
            timezone_id: Africa/Nairobi
            pause_status: UNPAUSED
          permissions:
            - level: CAN_MANAGE
              user_name: ${workspace.current_user.userName}
