<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV charging coverage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div class="frame">
    <header class="toolbar">
      <div class="brand">
        <p class="eyebrow" id="brand-eyebrow">EV coverage</p>
        <h1>EV charging coverage</h1>
      </div>
      <section class="stats" id="global-stats" aria-label="Totals"></section>
      <div class="region-picker" id="region-picker" role="group" aria-label="Regions"></div>
      <div class="toggles" id="type-toggles" role="group" aria-label="Station type"></div>
      <div class="toggles" id="candidate-toggle" role="group" aria-label="TVS candidates" hidden></div>
    </header>

    <div id="workspace" class="workspace is-merge" aria-live="polite"></div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/leaflet-maplibre-gl.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
